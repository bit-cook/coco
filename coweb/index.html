<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Co Web</title><link rel="icon" href="brand.svg"><link rel="stylesheet" href="app.css"></head>
<body><header><img src="brand.svg" alt="Co Web"><strong>Co Web</strong><button id="new">New session</button></header><main class="workspace"><aside class="session-sidebar"><h2>Sessions</h2><div id="sessions"></div></aside><section class="chat"><div id="controls"><select id="model" aria-label="Model"></select><select id="thinking" aria-label="Thinking level"></select></div><article id="messages"><p>Open a session or create a new one.</p></article><form id="prompt"><textarea placeholder="Message CoCo" required></textarea><button>Send</button></form></section><aside class="project-panel"><h2>Project files</h2><p id="cwd">Open a session to browse its project.</p><div id="files"></div><pre id="preview">Text previews are local and never executed.</pre></aside></main><script src="app.js"></script></body></html>
