name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.19.0
          cache: npm
      - run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:features
      - run: npm run build
      - run: npm run test:core
      - run: npm run test:integrity
      - run: npm run verify:closure
      - run: node scripts/publication-secret-scanner.mjs .
      - run: mkdir release
      - run: cp install.sh release/install.sh
      - run: cp uninstall.sh release/uninstall.sh
      - run: node node_modules/npm/bin/npm-cli.js pack --json --pack-destination release
      - run: node scripts/publication-secret-scanner.mjs release
      - run: node -e "import('./scripts/verify-package-closure.mjs').then(async ({verifyTarballClosure}) => { const {readdir}=await import('node:fs/promises'); const tarball=(await readdir('release')).find((entry)=>entry.endsWith('.tgz')); const result=await verifyTarballClosure({root:process.cwd(),tarball:'release/'+tarball}); console.log(JSON.stringify(result)); process.exit(result.status==='approved'?0:1); })"
      - run: tar -tzf release/coco-*.tgz | (! grep -E '(^package/(\.coco-tools|documentation/[^/]+/logs|test/)|/\.omo/)')
      - run: npm run build:offline
      - run: npm run build:vscode
      - working-directory: release
        run: sha256sum coco-*.tgz > coco-$(node -p "require('../package.json').version").tgz.sha256
      - working-directory: release
        run: sha256sum install.sh uninstall.sh coco-*.tgz coco-*.tgz.sha256 coco-*-offline-*.zip coco-*-offline-*.zip.sha256 coco-agent-*.vsix > SHA256SUMS
      - run: node scripts/publication-secret-scanner.mjs release
      - run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
      - run: gh release upload "$GITHUB_REF_NAME" --clobber release/install.sh release/uninstall.sh release/coco-*.tgz release/coco-*.tgz.sha256 release/coco-*-offline-*.zip release/coco-*-offline-*.zip.sha256 release/coco-agent-*.vsix release/SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify released assets and package lifecycle
        run: |
          release_dir="$(mktemp -d)"
           sandbox="$(mktemp -d)"
          version="$(node -p "require('./package.json').version")"
          base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/$GITHUB_REF_NAME"
           trap 'rm -rf "$release_dir" "$sandbox"' EXIT
          for asset in install.sh uninstall.sh "coco-$version.tgz" "coco-$version.tgz.sha256" "coco-$version-offline-linux-x64.zip" "coco-$version-offline-linux-x64.zip.sha256" "coco-agent-$version.vsix" SHA256SUMS; do
            curl -fsSL --retry 5 --retry-delay 2 "$base_url/$asset" -o "$release_dir/$asset"
          done
          (cd "$release_dir" && sha256sum --check SHA256SUMS)
           export HOME="$sandbox/home" COCO_INSTALL_DIR="$sandbox/install" COCO_AGENT_DIR="$sandbox/agent" COCO_CODING_AGENT_DIR="$sandbox/agent" COCO_BIN_DIR="$sandbox/bin" COCO_VERSION="$version"
           mkdir -p "$HOME" "$COCO_BIN_DIR"
           bash "$release_dir/install.sh"
           test "$("$COCO_BIN_DIR/coco" --version)" = "$version"
           bash "$release_dir/uninstall.sh"
           test ! -e "$COCO_BIN_DIR/coco"
           test ! -e "$COCO_INSTALL_DIR"
