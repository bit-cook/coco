name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.19.0
          cache: npm
      - run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run verify:closure
      - run: node scripts/publication-secret-scanner.mjs .
      - run: mkdir release
      - run: cp install.sh release/install.sh
      - run: cp uninstall.sh release/uninstall.sh
      - run: npm pack --json --pack-destination release
      - run: node scripts/publication-secret-scanner.mjs release
      - run: node -e "import('./scripts/verify-package-closure.mjs').then(async ({verifyTarballClosure}) => { const {readdir}=await import('node:fs/promises'); const tarball=(await readdir('release')).find((entry)=>entry.endsWith('.tgz')); const result=await verifyTarballClosure({root:process.cwd(),tarball:'release/'+tarball}); console.log(JSON.stringify(result)); process.exit(result.status==='approved'?0:1); })"
      - run: tar -tzf release/coco-*.tgz | (! grep -E '(^package/(\.coco-tools|documentation/[^/]+/logs|test/)|/\.omo/)')
      - working-directory: release
        run: sha256sum coco-*.tgz > coco-$(node -p "require('../package.json').version").tgz.sha256
      - working-directory: release
        run: sha256sum install.sh uninstall.sh coco-*.tgz coco-*.tgz.sha256 > SHA256SUMS
      - run: node scripts/publication-secret-scanner.mjs release
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes release/install.sh release/uninstall.sh release/coco-*.tgz release/coco-*.tgz.sha256 release/SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
      - run: curl -fsSL --retry 5 --retry-delay 2 "https://github.com/aithernexus/coco/releases/download/$GITHUB_REF_NAME/install.sh" >/dev/null
      - run: curl -fsSL --retry 5 --retry-delay 2 "https://github.com/aithernexus/coco/releases/download/$GITHUB_REF_NAME/uninstall.sh" >/dev/null
      - run: curl -fsSL --retry 5 --retry-delay 2 "https://github.com/aithernexus/coco/releases/download/$GITHUB_REF_NAME/coco-$(node -p "require('./package.json').version").tgz" >/dev/null
      - run: curl -fsSL --retry 5 --retry-delay 2 "https://github.com/aithernexus/coco/releases/download/$GITHUB_REF_NAME/coco-$(node -p "require('./package.json').version").tgz.sha256" >/dev/null
      - run: curl -fsSL --retry 5 --retry-delay 2 "https://github.com/aithernexus/coco/releases/download/$GITHUB_REF_NAME/SHA256SUMS" >/dev/null
