name: Selective Fork Promotion Verification

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selective-fork-promotion-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, Linux, X64, coco-promotion]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Select pinned self-hosted Node
        run: |
          node_dir="$RUNNER_TOOL_CACHE/node/22.19.0/x64/bin"
          test -x "$node_dir/node"
          printf '%s\n' "$node_dir" >> "$GITHUB_PATH"
      - run: test "$(node --version)" = "v22.19.0"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run verify:architecture
      - run: npm run build
      - run: npm run verify:closure
      - run: node scripts/verify-isolated-model-panel-candidate.mjs | tee selective-fork-remote-verification.json
      - run: node -e 'const value=require("./selective-fork-remote-verification.json");if(value.status!=="approved"||value.scope!=="isolated"||value.dependencyClosure?.source!=="candidate-bundled"||value.identity?.sourceTag!=="coco-v0.82.1-coco.2"||value.loader?.owner!=="coco.model-panel.v1"||value.loader?.fallbackOwner!=="fallback"||value.pty?.status!=="passed"||value.pty?.offline!==true||value.pty?.reload!=="passed"||value.pty?.panelOpens<2||value.rollout?.owner!=="coco.model-panel.v1"||value.promotionAuthorized!==false)process.exit(1)'
      - run: node scripts/verify-model-panel-rollback.mjs | tee selective-fork-rollback-verification.json
      - run: node -e 'const value=require("./selective-fork-rollback-verification.json");if(value.status!=="approved"||value.owner!=="fallback"||value.productionRegistration!=="blocked"||value.officialRuntime?.status!=="passed")process.exit(1)'
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: selective-fork-remote-verification
          path: |
            selective-fork-remote-verification.json
            selective-fork-rollback-verification.json
          if-no-files-found: error
          retention-days: 30
